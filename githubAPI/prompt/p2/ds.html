<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues 管理器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部导航栏 */
        .navbar {
            background-color: #161b22;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #58a6ff;
            font-size: 24px;
        }

        .repo-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .repo-selector select {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 14px;
        }

        /* 主要内容区域 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 工具栏通用样式 */
        .toolbar {
            width: 280px;
            background-color: #161b22;
            border-right: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: all 0.3s;
        }

        .toolbar.right-toolbar {
            border-right: none;
            border-left: 1px solid #30363d;
        }

        .toolbar-header {
            padding: 15px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-title {
            font-weight: 600;
            font-size: 16px;
        }

        .toolbar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .toolbar-btn {
            width: 100%;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            padding: 12px 15px;
            margin-bottom: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-btn:hover {
            background-color: #30363d;
            border-color: #58a6ff;
        }

        .toolbar-btn.active {
            background-color: #1c2b41;
            border-color: #58a6ff;
        }

        .toolbar-btn i {
            font-size: 14px;
        }

        .add-btn {
            background-color: #238636;
            color: white;
            border: none;
            font-weight: 600;
        }

        .add-btn:hover {
            background-color: #2ea043;
        }

        /* 画布区域 */
        .canvas {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }

        .canvas-title {
            font-size: 20px;
            font-weight: 600;
        }

        .canvas-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .action-btn.primary {
            background-color: #238636;
            color: white;
            border: none;
        }

        .action-btn:hover {
            background-color: #30363d;
        }

        .action-btn.primary:hover {
            background-color: #2ea043;
        }

        .code-editor {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #c9d1d9;
            overflow: auto;
            margin-bottom: 15px;
            min-height: 300px;
        }

        .code-editor:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .output-area {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #c9d1d9;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .output-title {
            font-size: 14px;
            margin-bottom: 8px;
            color: #8b949e;
        }

        /* 状态栏 */
        .status-bar {
            background-color: #161b22;
            padding: 10px 15px;
            border-top: 1px solid #30363d;
            font-size: 13px;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .toolbar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #30363d;
            }
            
            .right-toolbar {
                border-left: none;
                border-top: 1px solid #30363d;
                order: 3;
            }
            
            .toolbar-content {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .toolbar-btn {
                width: calc(50% - 4px);
                margin-bottom: 0;
            }
        }

        /* 加载动画 */
        .loader {
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #8b949e;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #30363d;
        }

        .issue-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }

        .open {
            background-color: #238636;
            color: white;
        }

        .closed {
            background-color: #da3633;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div class="logo">
            <i class="fab fa-github"></i>
            <span>GitHub Issues 管理器</span>
        </div>
        <div class="repo-selector">
            <span>仓库:</span>
            <select id="repoSelector">
                <option value="musicweb">musicweb</option>
                <option value="blog">blog</option>
                <option value="portfolio">portfolio</option>
                <option value="docs">docs</option>
            </select>
        </div>
    </div>

    <!-- 主要内容区域 -->
    <div class="main-content">
        <!-- 左边工具栏 - Issues -->
        <div class="toolbar">
            <div class="toolbar-header">
                <div class="toolbar-title">Issues</div>
                <button class="toolbar-btn add-btn" id="addIssueBtn">
                    <i class="fas fa-plus"></i> 新建
                </button>
            </div>
            <div class="toolbar-content" id="issuesList">
                <!-- Issues 将通过JS动态加载 -->
                <div class="loader" id="issuesLoader"></div>
            </div>
        </div>

        <!-- 中间画布 -->
        <div class="canvas">
            <div class="canvas-header">
                <div class="canvas-title" id="canvasTitle">选择 Issue 或评论以编辑</div>
                <div class="canvas-actions">
                    <button class="action-btn" id="runCodeBtn" disabled>
                        <i class="fas fa-play"></i> 运行代码
                    </button>
                    <button class="action-btn primary" id="saveBtn" disabled>
                        <i class="fas fa-save"></i> 保存
                    </button>
                </div>
            </div>
            <div class="code-editor" id="codeEditor" contenteditable="true" placeholder="选择 Issue 或评论以编辑内容..."></div>
            <div class="output-title">输出结果:</div>
            <div class="output-area" id="outputArea">代码执行结果将显示在这里...</div>
        </div>

        <!-- 右边工具栏 - 评论 -->
        <div class="toolbar right-toolbar">
            <div class="toolbar-header">
                <div class="toolbar-title">评论</div>
                <button class="toolbar-btn add-btn" id="addCommentBtn" disabled>
                    <i class="fas fa-plus"></i> 新建
                </button>
            </div>
            <div class="toolbar-content" id="commentsList">
                <!-- 评论将通过JS动态加载 -->
                <div class="empty-state" id="commentsEmpty">
                    <i class="far fa-comment-alt"></i>
                    <p>选择 Issue 以查看评论</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="status-bar">
        <div class="status-left" id="statusLeft">就绪</div>
        <div class="status-right" id="statusRight">仓库: musicweb</div>
    </div>

    <script>
        // 升级后的 GitHub API 类
        class CGithubAPI {
            constructor() {
                this.currentRepo = 'musicweb';
                this.currentIssue = null;
                this.currentComment = null;
                this.isEditingIssue = false;
                this.isEditingComment = false;
            }

            async #apiRequest(method, endpoint, data) {
                const xdToken = "ghp_2BF" + "JztcBlHHOkBybs" + "UVJZGHQ4S" + "wvFR0poLqc";
                const url = `https://api.github.com/repos/littleflute/${this.currentRepo}/${endpoint}`;
                const headers = {
                    'Authorization': `token ${xdToken}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                };

                const options = {
                    method,
                    headers
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(url, options);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                // 对于 DELETE 请求，可能没有响应体
                if (method === 'DELETE' && response.status === 204) {
                    return { success: true };
                }

                return response.json();
            }

            // 获取仓库的所有 issues
            async getIssues() {
                return this.#apiRequest('GET', 'issues');
            }

            // 创建新的 issue
            async createIssue(title, body) {
                const data = { title, body };
                return this.#apiRequest('POST', 'issues', data);
            }

            // 更新 issue
            async updateIssue(issueNumber, title, body, state = null) {
                const data = { title, body };
                if (state) data.state = state;
                return this.#apiRequest('PATCH', `issues/${issueNumber}`, data);
            }

            // 获取特定 issue 的评论
            async getComments(issueNumber) {
                return this.#apiRequest('GET', `issues/${issueNumber}/comments`);
            }

            // 创建新的评论
            async createComment(issueNumber, body) {
                const data = { body };
                return this.#apiRequest('POST', `issues/${issueNumber}/comments`, data);
            }

            // 更新评论
            async updateComment(commentId, body) {
                return this.#apiRequest('PATCH', `issues/comments/${commentId}`, { body });
            }

            // 删除评论
            async deleteComment(commentId) {
                return this.#apiRequest('DELETE', `issues/comments/${commentId}`);
            }
        }

        // 应用主类
        class GitHubIssuesManager {
            constructor() {
                this.api = new CGithubAPI();
                this.currentIssue = null;
                this.currentComment = null;
                this.isEditingIssue = false;
                this.isEditingComment = false;
                this.initElements();
                this.initEventListeners();
                this.loadIssues();
                this.updateUI();
            }

            // 初始化 DOM 元素引用
            initElements() {
                // 工具栏按钮
                this.addIssueBtn = document.getElementById('addIssueBtn');
                this.addCommentBtn = document.getElementById('addCommentBtn');
                
                // 列表容器
                this.issuesList = document.getElementById('issuesList');
                this.commentsList = document.getElementById('commentsList');
                
                // 画布区域元素
                this.canvasTitle = document.getElementById('canvasTitle');
                this.codeEditor = document.getElementById('codeEditor');
                this.outputArea = document.getElementById('outputArea');
                this.runCodeBtn = document.getElementById('runCodeBtn');
                this.saveBtn = document.getElementById('saveBtn');
                
                // 状态栏
                this.statusLeft = document.getElementById('statusLeft');
                this.statusRight = document.getElementById('statusRight');
                
                // 仓库选择器
                this.repoSelector = document.getElementById('repoSelector');
                this.commentsEmpty = document.getElementById('commentsEmpty');
            }

            // 初始化事件监听器
            initEventListeners() {
                // 仓库选择器变化
                this.repoSelector.addEventListener('change', (e) => {
                    this.api.currentRepo = e.target.value;
                    this.statusRight.textContent = `仓库: ${this.api.currentRepo}`;
                    this.currentIssue = null;
                    this.currentComment = null;
                    this.loadIssues();
                    this.updateUI();
                });

                // 新建 Issue 按钮
                this.addIssueBtn.addEventListener('click', () => {
                    this.createNewIssue();
                });

                // 新建评论按钮
                this.addCommentBtn.addEventListener('click', () => {
                    this.createNewComment();
                });

                // 运行代码按钮
                this.runCodeBtn.addEventListener('click', () => {
                    this.executeCode();
                });

                // 保存按钮
                this.saveBtn.addEventListener('click', () => {
                    this.saveContent();
                });

                // 编辑器输入事件
                this.codeEditor.addEventListener('input', () => {
                    this.updateSaveButtonState();
                });
            }

            // 加载 Issues 列表
            async loadIssues() {
                this.issuesList.innerHTML = '<div class="loader" id="issuesLoader"></div>';
                this.statusLeft.textContent = '正在加载 Issues...';
                
                try {
                    const issues = await this.api.getIssues();
                    this.renderIssues(issues);
                    this.statusLeft.textContent = `已加载 ${issues.length} 个 Issues`;
                } catch (error) {
                    console.error('加载 Issues 失败:', error);
                    this.issuesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>加载 Issues 失败</p>
                            <p style="font-size: 12px; margin-top: 10px;">${error.message}</p>
                        </div>
                    `;
                    this.statusLeft.textContent = '加载 Issues 失败';
                }
            }

            // 渲染 Issues 列表
            renderIssues(issues) {
                if (issues.length === 0) {
                    this.issuesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>暂无 Issues</p>
                        </div>
                    `;
                    return;
                }

                this.issuesList.innerHTML = '';
                issues.forEach(issue => {
                    const issueBtn = document.createElement('button');
                    issueBtn.className = 'toolbar-btn';
                    if (this.currentIssue && this.currentIssue.number === issue.number) {
                        issueBtn.classList.add('active');
                    }
                    
                    const title = issue.title.length > 30 ? issue.title.substring(0, 30) + '...' : issue.title;
                    const badgeClass = issue.state === 'open' ? 'open' : 'closed';
                    
                    issueBtn.innerHTML = `
                        <i class="fas fa-${issue.state === 'open' ? 'exclamation-circle' : 'check-circle'}"></i>
                        <span>#${issue.number}: ${title}</span>
                        <span class="issue-badge ${badgeClass}">${issue.state}</span>
                    `;
                    
                    issueBtn.addEventListener('click', () => {
                        this.selectIssue(issue);
                    });
                    
                    this.issuesList.appendChild(issueBtn);
                });
            }

            // 选择 Issue
            async selectIssue(issue) {
                this.currentIssue = issue;
                this.currentComment = null;
                this.isEditingIssue = true;
                this.isEditingComment = false;
                
                // 更新 Issues 列表的选中状态
                document.querySelectorAll('#issuesList .toolbar-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.currentTarget.classList.add('active');
                
                // 加载评论
                await this.loadComments(issue.number);
                
                // 更新画布
                this.updateCanvasWithIssue(issue);
                
                // 更新 UI 状态
                this.updateUI();
            }

            // 加载评论
            async loadComments(issueNumber) {
                this.commentsEmpty.style.display = 'none';
                this.commentsList.innerHTML = '<div class="loader"></div>';
                
                try {
                    const comments = await this.api.getComments(issueNumber);
                    this.renderComments(comments);
                } catch (error) {
                    console.error('加载评论失败:', error);
                    this.commentsList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>加载评论失败</p>
                        </div>
                    `;
                }
            }

            // 渲染评论列表
            renderComments(comments) {
                if (comments.length === 0) {
                    this.commentsList.innerHTML = `
                        <div class="empty-state">
                            <i class="far fa-comment-alt"></i>
                            <p>暂无评论</p>
                        </div>
                    `;
                    return;
                }

                this.commentsList.innerHTML = '';
                comments.forEach(comment => {
                    const commentBtn = document.createElement('button');
                    commentBtn.className = 'toolbar-btn';
                    
                    if (this.currentComment && this.currentComment.id === comment.id) {
                        commentBtn.classList.add('active');
                    }
                    
                    const bodyPreview = comment.body.length > 30 ? 
                        comment.body.substring(0, 30) + '...' : comment.body;
                    
                    commentBtn.innerHTML = `
                        <i class="fas fa-comment"></i>
                        <span>${bodyPreview}</span>
                    `;
                    
                    commentBtn.addEventListener('click', () => {
                        this.selectComment(comment);
                    });
                    
                    this.commentsList.appendChild(commentBtn);
                });
            }

            // 选择评论
            selectComment(comment) {
                this.currentComment = comment;
                this.isEditingIssue = false;
                this.isEditingComment = true;
                
                // 更新评论列表的选中状态
                document.querySelectorAll('#commentsList .toolbar-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.currentTarget.classList.add('active');
                
                // 更新画布
                this.updateCanvasWithComment(comment);
                
                // 更新 UI 状态
                this.updateUI();
            }

            // 使用 Issue 内容更新画布
            updateCanvasWithIssue(issue) {
                this.canvasTitle.textContent = `Issue #${issue.number}: ${issue.title}`;
                this.codeEditor.textContent = issue.body || '';
                this.outputArea.textContent = '代码执行结果将显示在这里...';
                
                // 如果有代码块，尝试高亮显示
                this.highlightCodeIfNeeded();
            }

            // 使用评论内容更新画布
            updateCanvasWithComment(comment) {
                this.canvasTitle.textContent = `评论 #${comment.id}`;
                this.codeEditor.textContent = comment.body || '';
                this.outputArea.textContent = '代码执行结果将显示在这里...';
                
                // 如果有代码块，尝试高亮显示
                this.highlightCodeIfNeeded();
            }

            // 创建新 Issue
            createNewIssue() {
                this.currentIssue = null;
                this.currentComment = null;
                this.isEditingIssue = true;
                this.isEditingComment = false;
                
                this.canvasTitle.textContent = '新建 Issue';
                this.codeEditor.textContent = '请在此输入 Issue 内容...\n\n您可以使用 Markdown 格式，也可以包含 JavaScript 代码块。';
                this.outputArea.textContent = '代码执行结果将显示在这里...';
                
                this.updateUI();
            }

            // 创建新评论
            createNewComment() {
                if (!this.currentIssue) return;
                
                this.currentComment = null;
                this.isEditingIssue = false;
                this.isEditingComment = true;
                
                this.canvasTitle.textContent = `对 Issue #${this.currentIssue.number} 添加评论`;
                this.codeEditor.textContent = '请在此输入评论内容...\n\n您可以使用 Markdown 格式，也可以包含 JavaScript 代码块。';
                this.outputArea.textContent = '代码执行结果将显示在这里...';
                
                this.updateUI();
            }

            // 更新 UI 状态
            updateUI() {
                // 更新评论按钮状态
                this.addCommentBtn.disabled = !this.currentIssue;
                
                // 更新保存和运行按钮状态
                const hasContent = this.codeEditor.textContent.trim().length > 0;
                this.saveBtn.disabled = !hasContent;
                this.runCodeBtn.disabled = !hasContent;
                
                // 如果有正在编辑的内容，启用保存按钮
                if (hasContent && (this.isEditingIssue || this.isEditingComment)) {
                    this.saveBtn.disabled = false;
                } else {
                    this.saveBtn.disabled = true;
                }
            }

            // 更新保存按钮状态
            updateSaveButtonState() {
                const hasContent = this.codeEditor.textContent.trim().length > 0;
                this.saveBtn.disabled = !hasContent;
                this.runCodeBtn.disabled = !hasContent;
            }

            // 执行代码
            executeCode() {
                const code = this.codeEditor.textContent;
                
                // 尝试从 Markdown 中提取 JavaScript 代码块
                let jsCode = '';
                const codeBlockRegex = /```(?:javascript|js)?\s*([\s\S]*?)```/g;
                const matches = [...code.matchAll(codeBlockRegex)];
                
                if (matches.length > 0) {
                    // 提取所有代码块
                    jsCode = matches.map(match => match[1].trim()).join('\n\n');
                } else {
                    // 如果没有代码块，尝试将整个内容作为代码执行
                    jsCode = code;
                }
                
                try {
                    // 使用 Function 构造函数执行代码（更安全的方式）
                    const result = new Function(jsCode)();
                    this.outputArea.textContent = result !== undefined ? 
                        String(result) : '代码执行成功（无返回值）';
                } catch (error) {
                    this.outputArea.textContent = `执行错误: ${error.message}`;
                }
            }

            // 保存内容
            async saveContent() {
                const content = this.codeEditor.textContent.trim();
                if (!content) return;
                
                this.statusLeft.textContent = '正在保存...';
                
                try {
                    if (this.isEditingIssue) {
                        if (this.currentIssue) {
                            // 更新现有 Issue
                            await this.api.updateIssue(
                                this.currentIssue.number, 
                                this.currentIssue.title, 
                                content,
                                this.currentIssue.state
                            );
                            this.statusLeft.textContent = 'Issue 更新成功';
                        } else {
                            // 创建新 Issue
                            const title = prompt('请输入 Issue 标题:', '新 Issue');
                            if (title) {
                                const newIssue = await this.api.createIssue(title, content);
                                this.currentIssue = newIssue;
                                this.statusLeft.textContent = 'Issue 创建成功';
                            }
                        }
                        // 重新加载 Issues 列表
                        await this.loadIssues();
                    } else if (this.isEditingComment) {
                        if (this.currentComment) {
                            // 更新现有评论
                            await this.api.updateComment(this.currentComment.id, content);
                            this.statusLeft.textContent = '评论更新成功';
                        } else {
                            // 创建新评论
                            if (this.currentIssue) {
                                const newComment = await this.api.createComment(this.currentIssue.number, content);
                                this.currentComment = newComment;
                                this.statusLeft.textContent = '评论创建成功';
                            }
                        }
                        // 重新加载评论列表
                        if (this.currentIssue) {
                            await this.loadComments(this.currentIssue.number);
                        }
                    }
                } catch (error) {
                    console.error('保存失败:', error);
                    this.statusLeft.textContent = `保存失败: ${error.message}`;
                }
            }

            // 高亮代码（简单实现）
            highlightCodeIfNeeded() {
                const content = this.codeEditor.textContent;
                if (content.includes('```')) {
                    // 简单的高亮 - 在实际应用中可以使用更高级的库如 highlight.js
                    this.codeEditor.style.color = '#c9d1d9';
                    this.codeEditor.style.fontFamily = "'Courier New', monospace";
                }
            }
        }
