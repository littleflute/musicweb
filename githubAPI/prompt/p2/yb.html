<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GitHub Issue 管理器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            font-size: 14px;
            background-color: #f6f8fa;
            color: #24292f;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 布局结构 */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 顶部导航栏 */
        .navbar {
            background-color: #24292f;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }
        
        .nav-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .repo-info {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* 主要内容区域 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* 左侧工具栏 - Issues列表 */
        .left-toolbar {
            width: 280px;
            background-color: white;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .toolbar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e1e4e8;
            font-weight: 600;
            background-color: #f6f8fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .toolbar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        /* 右侧工具栏 - 评论列表 */
        .right-toolbar {
            width: 280px;
            background-color: white;
            border-left: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        /* 中间画布区域 */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: white;
        }
        
        .canvas-header {
            padding: 12px 16px;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .canvas-title {
            font-weight: 600;
            font-size: 16px;
        }
        
        .canvas-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        /* 底部状态栏 */
        .status-bar {
            background-color: #24292f;
            color: #8b949e;
            padding: 8px 16px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        /* 按钮样式 */
        .btn {
            padding: 6px 12px;
            background-color: #2da44e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .btn:hover {
            background-color: #2c974b;
        }
        
        .btn-secondary {
            background-color: #f6f8fa;
            color: #24292f;
            border: 1px solid rgba(27, 31, 36, 0.15);
        }
        
        .btn-secondary:hover {
            background-color: #f3f4f6;
        }
        
        .btn-danger {
            background-color: #cf222e;
        }
        
        .btn-danger:hover {
            background-color: #a40e26;
        }
        
        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }
        
        .btn-icon {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        
        /* Issue和评论按钮样式 */
        .issue-btn, .comment-btn {
            width: 100%;
            padding: 12px;
            text-align: left;
            border: none;
            background: white;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid #e1e4e8;
            transition: background-color 0.1s, border-color 0.1s;
        }
        
        .issue-btn:hover, .comment-btn:hover {
            background-color: #f6f8fa;
            border-color: #d0d7de;
        }
        
        .issue-btn.active, .comment-btn.active {
            background-color: #ddf4ff;
            border-color: #54aeff;
        }
        
        .issue-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .issue-meta, .comment-meta {
            font-size: 11px;
            color: #57606a;
            display: flex;
            justify-content: space-between;
        }
        
        /* 编辑区域 */
        .editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        
        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        
        .editor-area {
            flex: 1;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            overflow: hidden;
        }
        
        #code-editor {
            width: 100%;
            height: 100%;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            border: none;
            resize: none;
            outline: none;
            tab-size: 2;
        }
        
        /* 结果区域 */
        .result-container {
            margin-top: 16px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .result-header {
            padding: 8px 12px;
            background-color: #f6f8fa;
            border-bottom: 1px solid #d0d7de;
            font-weight: 600;
        }
        
        .result-content {
            padding: 12px;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            background-color: white;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .left-toolbar, .right-toolbar {
                width: 100%;
                height: 200px;
                border-right: none;
                border-left: none;
            }
            
            .left-toolbar {
                border-bottom: 1px solid #e1e4e8;
            }
            
            .right-toolbar {
                border-top: 1px solid #e1e4e8;
                order: 3;
            }
            
            .canvas-area {
                order: 2;
            }
        }
        
        /* 加载状态 */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #57606a;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e1e4e8;
            border-top-color: #0969da;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 16px;
            border-bottom: 1px solid #e1e4e8;
            font-weight: 600;
        }
        
        .modal-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
        }
        
        .modal-footer {
            padding: 16px;
            border-top: 1px solid #e1e4e8;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }
        
        .form-textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #57606a;
        }
        
        .empty-state-icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        .empty-state-text {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航栏 -->
        <div class="navbar">
            <div class="nav-title">GitHub Issue 管理器</div>
            <div class="repo-info">仓库: <span id="current-repo">musicweb</span></div>
        </div>
        
        <!-- 主要内容区域 -->
        <div class="main-content">
            <!-- 左侧工具栏 - Issues列表 -->
            <div class="left-toolbar">
                <div class="toolbar-header">
                    <span>Issues</span>
                    <button class="btn btn-sm" id="new-issue-btn">新建 Issue</button>
                </div>
                <div class="toolbar-content" id="issues-list">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>加载 Issues...</span>
                    </div>
                </div>
            </div>
            
            <!-- 中间画布区域 -->
            <div class="canvas-area">
                <div class="canvas-header">
                    <div class="canvas-title" id="canvas-title">请选择一个 Issue 或评论</div>
                    <div class="editor-toolbar">
                        <button class="btn btn-secondary btn-sm" id="save-btn" disabled>保存</button>
                        <button class="btn btn-sm" id="run-btn" disabled>运行代码</button>
                    </div>
                </div>
                <div class="canvas-content">
                    <div class="editor-container">
                        <div class="editor-area">
                            <textarea id="code-editor" placeholder="选择一个 Issue 或评论进行编辑..."></textarea>
                        </div>
                        <div class="result-container" id="result-container" style="display: none;">
                            <div class="result-header">运行结果</div>
                            <div class="result-content" id="code-result"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧工具栏 - 评论列表 -->
            <div class="right-toolbar">
                <div class="toolbar-header">
                    <span>评论</span>
                    <button class="btn btn-sm" id="new-comment-btn" disabled>新建评论</button>
                </div>
                <div class="toolbar-content" id="comments-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">选择一个 Issue 查看评论</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部状态栏 -->
        <div class="status-bar">
            <div id="status-message">就绪</div>
            <div id="selected-info">未选择任何项目</div>
        </div>
    </div>
    
    <!-- 新建/编辑 Issue 模态框 -->
    <div class="modal" id="issue-modal">
        <div class="modal-content">
            <div class="modal-header" id="issue-modal-title">新建 Issue</div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="issue-title">标题</label>
                    <input type="text" class="form-input" id="issue-title" placeholder="输入 Issue 标题">
                </div>
                <div class="form-group">
                    <label class="form-label" for="issue-body">内容</label>
                    <textarea class="form-textarea" id="issue-body" placeholder="输入 Issue 内容..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-issue-btn">取消</button>
                <button class="btn" id="save-issue-btn">保存 Issue</button>
            </div>
        </div>
    </div>
    
    <!-- 新建/编辑评论模态框 -->
    <div class="modal" id="comment-modal">
        <div class="modal-content">
            <div class="modal-header" id="comment-modal-title">新建评论</div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="comment-body">评论内容</label>
                    <textarea class="form-textarea" id="comment-body" placeholder="输入评论内容..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-comment-btn">取消</button>
                <button class="btn" id="save-comment-btn">保存评论</button>
            </div>
        </div>
    </div>

    <script>
        const xdApp = {};
        // 升级版的 GitHub API 类
        class CGithubAPI {
            constructor() {
                this.currentRepo = 'musicweb';
                this.baseURL = 'https://api.github.com';
                this.token = "ghp_2BF" + "JztcBlHHOkBybs" + "UVJZGHQ4S" + "wvFR0poLqc";
                this.currentIssue = null;
                this.currentComment = null;
            }
            
            async #apiRequest(method, endpoint, data = null) {
                const url = `${this.baseURL}/repos/littleflute/${this.currentRepo}${endpoint}`;
                const headers = {
                    'Authorization': `token ${this.token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };
                
                const options = {
                    method,
                    headers,
                };
                
                if (data) {
                    options.body = JSON.stringify(data);
                }
                
                try {
                    const response = await fetch(url, options);
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errorText}`);
                    }
                    
                    // 处理204 No Content响应
                    if (response.status === 204) {
                        return null;
                    }
                    
                    return await response.json();
                } catch (error) {
                    console.error('API请求失败:', error);
                    throw error;
                }
            }
            
            // 获取当前仓库的Issues
            async getIssues() {
                return this.#apiRequest('GET', '/issues?state=all&per_page=100');
            }
            
            // 创建新的Issue
            async createIssue(title, body) {
                return this.#apiRequest('POST', '/issues', { title, body });
            }
            
            // 更新Issue
            async updateIssue(issueNumber, data) {
                return this.#apiRequest('PATCH', `/issues/${issueNumber}`, data);
            }
            
            // 获取Issue的评论
            async getComments(issueNumber) {
                return this.#apiRequest('GET', `/issues/${issueNumber}/comments?per_page=100`);
            }
            
            // 创建评论
            async createComment(issueNumber, body) {
                return this.#apiRequest('POST', `/issues/${issueNumber}/comments`, { body });
            }
            
            // 更新评论
            async updateComment(commentId, body) {
                return this.#apiRequest('PATCH', `/issues/comments/${commentId}`, { body });
            }
            
            // 删除评论
            async deleteComment(commentId) {
                return this.#apiRequest('DELETE', `/issues/comments/${commentId}`);
            }
            
            // 设置当前选中的Issue
            setCurrentIssue(issue) {
                this.currentIssue = issue;
            }
            
            // 设置当前选中的评论
            setCurrentComment(comment) {
                this.currentComment = comment;
            }
        }
        
        // 应用主类
        class GitHubIssueManager {
            constructor() {
                this.api = new CGithubAPI();
                this.currentRepo = 'musicweb';
                this.currentIssue = null;
                this.currentComment = null;
                this.isEditingIssue = false;
                this.isEditingComment = false;
                
                this.initElements();
                this.bindEvents();
                this.loadIssues();
            }
            
            // 初始化DOM元素引用
            initElements() {
                // 工具栏
                this.issuesList = document.getElementById('issues-list');
                this.commentsList = document.getElementById('comments-list');
                
                // 按钮
                this.newIssueBtn = document.getElementById('new-issue-btn');
                this.newCommentBtn = document.getElementById('new-comment-btn');
                this.saveBtn = document.getElementById('save-btn');
                this.runBtn = document.getElementById('run-btn');
                
                // 编辑器
                this.codeEditor = document.getElementById('code-editor');
                this.codeResult = document.getElementById('code-result');
                this.canvasTitle = document.getElementById('canvas-title');
                
                // 状态栏
                this.statusMessage = document.getElementById('status-message');
                this.selectedInfo = document.getElementById('selected-info');
                this.currentRepoEl = document.getElementById('current-repo');
                
                // 模态框
                this.issueModal = document.getElementById('issue-modal');
                this.commentModal = document.getElementById('comment-modal');
                
                // 表单元素
                this.issueTitleInput = document.getElementById('issue-title');
                this.issueBodyInput = document.getElementById('issue-body');
                this.commentBodyInput = document.getElementById('comment-body');
                
                // 模态框按钮
                this.cancelIssueBtn = document.getElementById('cancel-issue-btn');
                this.saveIssueBtn = document.getElementById('save-issue-btn');
                this.cancelCommentBtn = document.getElementById('cancel-comment-btn');
                this.saveCommentBtn = document.getElementById('save-comment-btn');
                
                // 结果容器
                this.resultContainer = document.getElementById('result-container');
            }
            
            // 绑定事件监听器
            bindEvents() {
                // 新建Issue按钮
                this.newIssueBtn.addEventListener('click', () => this.showIssueModal());
                
                // 新建评论按钮
                this.newCommentBtn.addEventListener('click', () => this.showCommentModal());
                
                // 保存按钮
                this.saveBtn.addEventListener('click', () => this.saveCurrentItem());
                
                // 运行按钮
                this.runBtn.addEventListener('click', () => this.runCode());
                
                // 编辑器内容变化
                this.codeEditor.addEventListener('input', () => {
                    this.saveBtn.disabled = false;
                });
                
                // 模态框取消按钮
                this.cancelIssueBtn.addEventListener('click', () => this.hideIssueModal());
                this.cancelCommentBtn.addEventListener('click', () => this.hideCommentModal());
                
                // 模态框保存按钮
                this.saveIssueBtn.addEventListener('click', () => this.saveIssue());
                this.saveCommentBtn.addEventListener('click', () => this.saveComment());
                
                // 点击模态框外部关闭
                this.issueModal.addEventListener('click', (e) => {
                    if (e.target === this.issueModal) this.hideIssueModal();
                });
                
                this.commentModal.addEventListener('click', (e) => {
                    if (e.target === this.commentModal) this.hideCommentModal();
                });
            }
            
            // 更新状态栏
            updateStatus(message, type = 'info') {
                this.statusMessage.textContent = message;
                console.log(`状态: ${message}`);
            }
            
            // 更新选中信息
            updateSelectedInfo() {
                if (this.currentComment) {
                    this.selectedInfo.textContent = `Issue #${this.currentIssue?.number} - 评论 ${this.currentComment.id}`;
                } else if (this.currentIssue) {
                    this.selectedInfo.textContent = `Issue #${this.currentIssue.number}: ${this.currentIssue.title}`;
                } else {
                    this.selectedInfo.textContent = '未选择任何项目';
                }
            }
            
            // 加载Issues列表
            async loadIssues() {
                this.updateStatus('正在加载 Issues...');
                
                try {
                    const issues = await this.api.getIssues();
                    this.renderIssues(issues);
                    this.updateStatus(`已加载 ${issues.length} 个 Issues`);
                } catch (error) {
                    console.error('加载Issues失败:', error);
                    this.updateStatus(`加载失败: ${error.message}`, 'error');
                    this.showError('加载Issues失败');
                }
            }
            
            // 渲染Issues列表
            renderIssues(issues) {
                this.issuesList.innerHTML = '';
                
                if (!issues || issues.length === 0) {
                    this.issuesList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <div class="empty-state-text">暂无 Issues</div>
                        </div>
                    `;
                    return;
                }
                
                issues.forEach(issue => {
                    const issueBtn = document.createElement('button');
                    issueBtn.className = 'issue-btn';
                    issueBtn.innerHTML = `
                        <div class="issue-title">#${issue.number}: ${issue.title}</div>
                        <div class="issue-meta">
                            <span>${this.formatDate(issue.created_at)}</span>
                            <span>${issue.state === 'open' ? '🟢 开启' : '🔴 关闭'}</span>
                        </div>
                    `;
                    
                    issueBtn.addEventListener('click', () => this.selectIssue(issue));
                    
                    // 高亮当前选中的Issue
                    if (this.currentIssue && issue.number === this.currentIssue.number) {
                        issueBtn.classList.add('active');
                    }
                    
                    this.issuesList.appendChild(issueBtn);
                });
            }
            
            // 选择Issue
            async selectIssue(issue) {
                this.currentIssue = issue;
                this.currentComment = null;
                this.api.setCurrentIssue(issue);
                
                // 更新UI状态
                this.updateSelectedInfo();
                this.newCommentBtn.disabled = false;
                
                // 高亮选中的Issue
                document.querySelectorAll('.issue-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.closest('.issue-btn').classList.add('active');
                
                // 更新画布显示Issue内容
                this.canvasTitle.textContent = `Issue #${issue.number}: ${issue.title}`;
                this.codeEditor.value = issue.body || '';
                this.codeEditor.placeholder = '编辑 Issue 内容...';
                this.saveBtn.disabled = true;
                
                // 显示运行按钮（Issue内容可能是代码）
                this.runBtn.disabled = false;
                
                // 加载该Issue的评论
                await this.loadComments(issue.number);
                
                this.updateStatus(`已选择 Issue #${issue.number}`);
            }
            
            // 加载评论
            async loadComments(issueNumber) {
                this.updateStatus('正在加载评论...');
                
                try {
                    const comments = await this.api.getComments(issueNumber);
                    this.renderComments(comments);
                    this.updateStatus(`已加载 ${comments.length} 条评论`);
                } catch (error) {
                    console.error('加载评论失败:', error);
                    this.updateStatus(`加载评论失败: ${error.message}`, 'error');
                    this.showError('加载评论失败');
                }
            }
            
            // 渲染评论列表
            renderComments(comments) {
                this.commentsList.innerHTML = '';
                
                if (!comments || comments.length === 0) {
                    this.commentsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">💬</div>
                            <div class="empty-state-text">暂无评论</div>
                        </div>
                    `;
                    return;
                }
                
                comments.forEach(comment => {
                    const commentBtn = document.createElement('button');
                    commentBtn.className = 'comment-btn';
                    
                    // 截取评论内容前50个字符作为预览
                    const preview = comment.body.length > 50 
                        ? comment.body.substring(0, 50) + '...' 
                        : comment.body;
                    
                    commentBtn.innerHTML = `
                        <div class="issue-title">评论 #${comment.id}</div>
                        <div class="comment-meta">
                            <span>${this.formatDate(comment.created_at)}</span>
                            <span>${comment.user?.login || '未知用户'}</span>
                        </div>
                        <div style="font-size: 12px; margin-top: 4px; color: #57606a;">${preview}</div>
                    `;
                    
                    commentBtn.addEventListener('click', () => this.selectComment(comment));
                    
                    // 添加删除按钮
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn btn-danger btn-sm';
                    deleteBtn.textContent = '删除';
                    deleteBtn.style.marginTop = '8px';
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.deleteComment(comment.id);
                    });
                    
                    commentBtn.appendChild(deleteBtn);
                    
                    // 高亮当前选中的评论
                    if (this.currentComment && comment.id === this.currentComment.id) {
                        commentBtn.classList.add('active');
                    }
                    
                    this.commentsList.appendChild(commentBtn);
                });
            }
            
            // 选择评论
            selectComment(comment) {
                this.currentComment = comment;
                this.api.setCurrentComment(comment);
                
                // 更新UI状态
                this.updateSelectedInfo();
                
                // 高亮选中的评论
                document.querySelectorAll('.comment-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.closest('.comment-btn').classList.add('active');
                
                // 更新画布显示评论内容
                this.canvasTitle.textContent = `评论 #${comment.id}`;
                this.codeEditor.value = comment.body;
                this.codeEditor.placeholder = '编辑评论内容...';
                this.saveBtn.disabled = true;
                
                // 显示运行按钮（评论内容可能是代码）
                this.runBtn.disabled = false;
                
                this.updateStatus(`已选择评论 #${comment.id}`);
            }
            
            // 显示新建/编辑Issue模态框
            showIssueModal(issue = null) {
                this.isEditingIssue = issue !== null;
                
                if (issue) {
                    document.getElementById('issue-modal-title').textContent = '编辑 Issue';
                    this.issueTitleInput.value = issue.title;
                    this.issueBodyInput.value = issue.body || '';
                } else {
                    document.getElementById('issue-modal-title').textContent = '新建 Issue';
                    this.issueTitleInput.value = '';
                    this.issueBodyInput.value = '';
                }
                
                this.issueModal.style.display = 'flex';
            }
            
            // 隐藏Issue模态框
            hideIssueModal() {
                this.issueModal.style.display = 'none';
            }
            
            // 显示新建/编辑评论模态框
            showCommentModal(comment = null) {
                this.isEditingComment = comment !== null;
                
                if (comment) {
                    document.getElementById('comment-modal-title').textContent = '编辑评论';
                    this.commentBodyInput.value = comment.body;
                } else {
                    document.getElementById('comment-modal-title').textContent = '新建评论案件中';
                    this.commentBodyInput.value = '';
                }
                
                this.commentModal.style.display = 'flex';
            }
            
            // 隐藏评论模态框
            hideCommentModal() {
                this.commentModal.style.display = 'none';
            }
            
            // 保存Issue
            async saveIssue() {
                const title = this.issueTitleInput.value.trim();
                const body = this.issueBodyInput.value.trim();
                
                if (!title) {
                    this.showError('请输入Issue标题');
                    return;
                }
                
                this.updateStatus('正在保存Issue...');
                
                try {
                    if (this.isEditingIssue) {
                        // 更新现有Issue
                        await this.api.updateIssue(this.currentIssue.number, { title, body });
                        this.updateStatus('Issue更新成功');
                    } else {
                        // 创建新Issue
                        await this.api.createIssue(title, body);
                        this.updateStatus('Issue创建成功');
                    }
                    
                    this.hideIssueModal();
                    await this.loadIssues(); // 重新加载Issues列表
                    
                } catch (error) {
                    console.error('保存Issue失败:', error);
                    this.updateStatus(`保存失败: ${error.message}`, 'error');
                    this.showError('保存Issue失败');
                }
            }
            
            // 保存评论
            async saveComment() {
                const body = this.commentBodyInput.value.trim();
                
                if (!body) {
                    this.showError('请输入评论内容');
                    return;
                }
                
                if (!this.currentIssue) {
                    this.showError('请先选择一个Issue');
                    return;
                }
                
                this.updateStatus('正在保存评论...');
                
                try {
                    if (this.isEditingComment) {
                        // 更新现有评论
                        await this.api.updateComment(this.currentComment.id, { body });
                        this.updateStatus('评论更新成功');
                    } else {
                        // 创建新评论
                        await this.api.createComment(this.currentIssue.number, body);
                        this.updateStatus('评论创建成功');
                    }
                    
                    this.hideCommentModal();
                    await this.loadComments(this.currentIssue.number); // 重新加载评论列表
                    
                } catch (error) {
                    console.error('保存评论失败:', error);
                    this.updateStatus(`保存失败: ${error.message}`, 'error');
                    this.showError('保存评论失败');
                }
            }
            
            // 删除评论
            async deleteComment(commentId) {
                if (!confirm('确定要删除这条评论吗？此操作不可撤销。')) {
                    return;
                }
                
                this.updateStatus('正在删除评论...');
                
                try {
                    await this.api.deleteComment(commentId);
                    this.updateStatus('评论删除成功');
                    
                    // 重新加载评论列表
                    if (this.currentIssue) {
                        await this.loadComments(this.currentIssue.number);
                    }
                    
                    // 如果删除的是当前选中的评论，清空编辑器
                    if (this.currentComment && this.currentComment.id === commentId) {
                        this.currentComment = null;
                        this.canvasTitle.textContent = '请选择一个 Issue 或评论';
                        this.codeEditor.value = '';
                        this.saveBtn.disabled = true;
                    }
                    
                } catch (error) {
                    console.error('删除评论失败:', error);
                    this.updateStatus(`删除失败: ${error.message}`, 'error');
                    this.showError('删除评论失败');
                }
            }
            
            // 保存当前编辑的项目
            async saveCurrentItem() {
                if (!this.currentIssue && !this.currentComment) {
                    this.showError('没有选中任何项目');
                    return;
                }
                
                const newContent = this.codeEditor.value;
                
                this.updateStatus('正在保存...');
                
                try {
                    if (this.currentComment) {
                        // 保存评论
                        await this.api.updateComment(this.currentComment.id, { body: newContent });
                        this.currentComment.body = newContent;
                        this.updateStatus('评论已保存');
                    } else if (this.currentIssue) {
                        // 保存Issue
                        await this.api.updateIssue(this.currentIssue.number, { body: newContent });
                        this.currentIssue.body = newContent;
                        this.updateStatus('Issue已保存');
                    }
                    
                    this.saveBtn.disabled = true;
                    
                } catch (error) {
                    console.error('保存失败:', error);
                    this.updateStatus(`保存失败: ${error.message}`, 'error');
                    this.showError('保存失败');
                }
            }
            
            // 运行代码
            runCode() {
                const code = this.codeEditor.value.trim();
                
                if (!code) {
                    this.showError('没有代码可运行');
                    return;
                }
                
                this.updateStatus('正在运行代码...');
                
                try {
                    // 清空之前的结果
                    this.codeResult.innerHTML = '';
                    this.resultContainer.style.display = 'block';
                    
                    // 捕获console.log输出
                    let output = '';
                    const originalLog = console.log;
                    console.log = (...args) => {
                        output += args.map(arg => 
                            typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                        ).join(' ') + '\n';
                        originalLog.apply(console, args);
                    };
                    
                    // 尝试执行代码
                    const result = eval(code);
                    
                    // 恢复console.log
                    console.log = originalLog;
                    
                    // 显示结果
                    if (result !== undefined) {
                        output += `\n返回值: ${typeof result === 'object' ? JSON.stringify(result, null, 2) : result}`;
                    }
                    
                    this.codeResult.textContent = output || '代码执行成功，但无输出。';
                    this.updateStatus('代码执行成功');
                    
                } catch (error) {
                    this.codeResult.textContent = `错误: ${error.message}\n\n${error.stack}`;
                    this.updateStatus('代码执行出错', 'error');
                }
            }
            
            // 显示错误消息
            showError(message) {
                alert(`错误: ${message}`);
            }
            
            // 格式化日期
            formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }
        }
        
        // 页面加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            window.app = new GitHubIssueManager();
            
        });
    </script>
</body>
</html>
