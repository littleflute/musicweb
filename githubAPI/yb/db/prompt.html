<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues和评论管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f5f5f5;
        }
        /* 顶部导航菜单 */
        header {
            background-color: #24292e;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.5rem;
        }
        nav a {
            color: white;
            margin-left: 15px;
            text-decoration: none;
        }
        /* 主内容区：左右工具栏和中间画布 */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        /* 工具栏公共样式 */
        .toolbar {
            width: 250px;
            background-color: #fff;
            border: 1px solid #ddd;
            overflow-y: auto;
            padding: 10px;
            flex-shrink: 0;
        }
        .toolbar h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .toolbar button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 10px;
            text-align: left;
            background-color: #f6f8fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toolbar button:hover {
            background-color: #e1e4e8;
        }
        .toolbar button.active {
            background-color: #0366d6;
            color: white;
        }
        /* 左侧工具栏 */
        .left-toolbar {
            border-right: 2px solid #ccc;
        }
        /* 右侧工具栏 */
        .right-toolbar {
            border-left: 2px solid #ccc;
        }
        /* 中间画布 */
        .canvas {
            flex: 1;
            background-color: white;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #ddd;
            margin: 0 5px;
        }
        .canvas-content {
            line-height: 1.6;
        }
        .canvas-content h2 {
            color: #24292e;
            margin-bottom: 10px;
        }
        .canvas-content p {
            color: #444;
        }
        /* 表单样式 */
        .edit-form, .comment-form {
            margin: 15px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #0366d6;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0250a3;
        }
        .btn-secondary {
            background-color: #f6f8fa;
            color: #333;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background-color: #e1e4e8;
        }
        /* 底部状态栏 */
        footer {
            background-color: #24292e;
            color: white;
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
        }
        /* 响应式设计：手机适配 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .toolbar {
                width: 100%;
                height: 200px;
                border: 1px solid #ddd;
                margin: 5px 0;
            }
            .left-toolbar, .right-toolbar {
                border: 1px solid #ccc;
            }
            .canvas {
                margin: 5px 0;
            }
        }
        .error {
            color: red;
            padding: 10px;
        }
        .success {
            color: green;
            padding: 10px;
        }
        .loading {
            color: #0366d6;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>GitHub Issues和评论管理</h1>
        <nav>
            <a href="#" id="refresh">刷新</a>
            <a href="#" id="repoInfo">仓库信息</a>
        </nav>
    </header>
    <div class="container">
        <div class="toolbar left-toolbar">
            <h3>Issues 列表</h3>
            <div id="issues-list">
                <div class="loading">加载中...</div>
            </div>
        </div>
        <div class="canvas">
            <div class="canvas-content" id="canvas-content">
                <p>点击左侧的issue按钮查看详情，点击右侧的评论按钮查看评论。</p>
            </div>
        </div>
        <div class="toolbar right-toolbar">
            <h3>评论 列表</h3>
            <div id="comments-list">
                <p>选择一个issue以加载评论。</p>
            </div>
        </div>
    </div>
    <footer>
        <div id="status">就绪 | 仓库: musicweb</div>
    </footer>

    <script>
        // 升级CGithubAPI类 - 新增编辑/添加功能
        class CGithubAPI {
            constructor() {
                this.currentRepo = 'musicweb';
                this.baseUrl = 'https://api.github.com/repos/littleflute';
            }

            // 私有方法：API请求
            async #apiRequest(method, endpoint, data) {
                const token = "ghp_2BF" + "JztcBlHHOkBybs" + "UVJZGHQ4S" + "wvFR0poLqc"; // 实际使用请替换为安全存储的Token
                const url = `${this.baseUrl}/${this.currentRepo}/${endpoint}`;
                const headers = {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                };

                const response = await fetch(url, {
                    method,
                    headers,
                    body: data ? JSON.stringify(data) : null
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }
                return response.json();
            }

            // 获取所有Issues
            async getIssues() {
                try {
                    const endpoint = 'issues?state=all&per_page=100';
                    return await this.#apiRequest('GET', endpoint, null);
                } catch (error) {
                    console.error('获取issues失败:', error);
                    throw error;
                }
            }

            // 获取特定Issue的评论
            async getComments(issueNumber) {
                try {
                    const endpoint = `issues/${issueNumber}/comments`;
                    return await this.#apiRequest('GET', endpoint, null);
                } catch (error) {
                    console.error('获取评论失败:', error);
                    throw error;
                }
            }

            // 获取仓库信息
            async getRepoInfo() {
                try {
                    return await this.#apiRequest('GET', '', null);
                } catch (error) {
                    console.error('获取仓库信息失败:', error);
                    throw error;
                }
            }

            // 编辑Issue（更新标题/内容）
            async updateIssue(issueNumber, title, body) {
                try {
                    const endpoint = `issues/${issueNumber}`;
                    const data = { title, body };
                    return await this.#apiRequest('PATCH', endpoint, data);
                } catch (error) {
                    console.error('编辑Issue失败:', error);
                    throw error;
                }
            }

            // 编辑评论
            async updateComment(commentId, body) {
                try {
                    const endpoint = `issues/comments/${commentId}`;
                    const data = { body };
                    return await this.#apiRequest('PATCH', endpoint, data);
                } catch (error) {
                    console.error('编辑评论失败:', error);
                    throw error;
                }
            }

            // 添加新评论
            async createComment(issueNumber, body) {
                try {
                    const endpoint = `issues/${issueNumber}/comments`;
                    const data = { body };
                    return await this.#apiRequest('POST', endpoint, data);
                } catch (error) {
                    console.error('添加评论失败:', error);
                    throw error;
                }
            }
        }

        // 网页应用逻辑
        document.addEventListener('DOMContentLoaded', () => {
            const api = new CGithubAPI();
            const issuesList = document.getElementById('issues-list');
            const commentsList = document.getElementById('comments-list');
            const canvasContent = document.getElementById('canvas-content');
            const statusBar = document.getElementById('status');
            const refreshBtn = document.getElementById('refresh');
            const repoInfoBtn = document.getElementById('repoInfo');

            // 存储当前选中的Issue/Comment ID
            let currentIssueNumber = null;
            let currentCommentId = null;

            // 更新状态栏
            function updateStatus(message) {
                statusBar.textContent = `${message} | 仓库: ${api.currentRepo}`;
            }

            // 显示错误
            function showError(element, error) {
                element.innerHTML = `<div class="error">错误: ${error.message}</div>`;
            }

            // 显示成功提示
            function showSuccess(element, message) {
                element.innerHTML = `<div class="success">成功: ${message}</div>`;
                setTimeout(() => {
                    element.querySelector('.success')?.remove();
                }, 3000);
            }

            // 加载并显示Issues
            async function loadIssues() {
                issuesList.innerHTML = '<div class="loading">加载issues中...</div>';
                updateStatus('加载issues中...');
                try {
                    const issues = await api.getIssues();
                    if (issues.length === 0) {
                        issuesList.innerHTML = '<p>没有找到issues。</p>';
                        return;
                    }
                    issuesList.innerHTML = '';
                    issues.forEach(issue => {
                        const button = document.createElement('button');
                        button.textContent = `#${issue.number}: ${issue.title}`;
                        button.dataset.issueNumber = issue.number;
                        button.dataset.issueBody = issue.body || '无描述';
                        button.addEventListener('click', () => onIssueClick(issue));
                        issuesList.appendChild(button);
                    });
                    updateStatus('issues加载完成');
                } catch (error) {
                    showError(issuesList, error);
                    updateStatus('加载失败');
                }
            }

            // 处理Issue点击事件
            async function onIssueClick(issue) {
                // 记录当前选中的Issue编号
                currentIssueNumber = issue.number;
                currentCommentId = null;

                // 更新左侧按钮活动状态
                document.querySelectorAll('#issues-list button').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');

                // 在画布中显示Issue详情 + 编辑表单 + 新增评论表单
                canvasContent.innerHTML = `
                    <h2>Issue #${issue.number}: ${issue.title}</h2>
                    <p><strong>状态:</strong> ${issue.state} | <strong>创建者:</strong> ${issue.user.login}</p>
                    <p><strong>创建时间:</strong> ${new Date(issue.created_at).toLocaleString()}</p>
                    <hr>
                    
                    <!-- Issue编辑表单 -->
                    <div class="edit-form">
                        <h3>编辑Issue</h3>
                        <div class="form-group">
                            <label for="issue-title">标题:</label>
                            <input type="text" id="issue-title" value="${escapeHtml(issue.title)}">
                        </div>
                        <div class="form-group">
                            <label for="issue-body">内容:</label>
                            <textarea id="issue-body">${escapeHtml(issue.body || '')}</textarea>
                        </div>
                        <button class="btn btn-primary" onclick="saveIssueEdit(${issue.number})">保存修改</button>
                    </div>

                    <hr>
                    <h3>Issue内容</h3>
                    <p>${issue.body || '无描述'}</p>
                    
                    <!-- 新增评论表单 -->
                    <div class="comment-form" style="margin-top: 20px;">
                        <h3>添加新评论</h3>
                        <div class="form-group">
                            <label for="new-comment-body">评论内容:</label>
                            <textarea id="new-comment-body" placeholder="输入评论内容..."></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="addNewComment(${issue.number})">提交评论</button>
                    </div>
                `;

                // 加载该Issue的评论
                loadComments(issue.number);
            }

            // 加载并显示评论
            async function loadComments(issueNumber) {
                commentsList.innerHTML = '<div class="loading">加载评论中...</div>';
                updateStatus(`加载issue #${issueNumber}的评论中...`);
                try {
                    const comments = await api.getComments(issueNumber);
                    if (comments.length === 0) {
                        commentsList.innerHTML = '<p>没有评论。</p>';
                        return;
                    }
                    commentsList.innerHTML = '';
                    comments.forEach(comment => {
                        const button = document.createElement('button');
                        button.textContent = `评论者: ${comment.user.login} (${new Date(comment.created_at).toLocaleDateString()})`;
                        button.dataset.commentId = comment.id;
                        button.dataset.commentBody = comment.body;
                        button.addEventListener('click', () => onCommentClick(comment));
                        commentsList.appendChild(button);
                    });
                    updateStatus(`评论加载完成，共${comments.length}条`);
                } catch (error) {
                    showError(commentsList, error);
                    updateStatus('评论加载失败');
                }
            }

            // 处理评论点击事件
            function onCommentClick(comment) {
                // 记录当前选中的评论ID
                currentCommentId = comment.id;

                // 更新右侧按钮活动状态
                document.querySelectorAll('#comments-list button').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');

                // 在画布中显示评论详情 + 编辑表单
                canvasContent.innerHTML = `
                    <h2>评论详情</h2>
                    <p><strong>评论者:</strong> ${comment.user.login}</p>
                    <p><strong>时间:</strong> ${new Date(comment.created_at).toLocaleString()}</p>
                    <hr>
                    
                    <!-- 评论编辑表单 -->
                    <div class="edit-form">
                        <h3>编辑评论</h3>
                        <div class="form-group">
                            <label for="comment-body">评论内容:</label>
                            <textarea id="comment-body">${escapeHtml(comment.body)}</textarea>
                        </div>
                        <button class="btn btn-primary" onclick="saveCommentEdit(${comment.id})">保存修改</button>
                    </div>

                    <hr>
                    <h3>评论内容</h3>
                    <p>${comment.body}</p>
                `;
            }

            // 保存Issue编辑（全局函数，供表单调用）
            window.saveIssueEdit = async function(issueNumber) {
                const titleInput = document.getElementById('issue-title');
                const bodyInput = document.getElementById('issue-body');
                const title = titleInput.value.trim();
                const body = bodyInput.value.trim();

                if (!title) {
                    alert('标题不能为空！');
                    return;
                }

                updateStatus(`正在更新Issue #${issueNumber}...`);
                try {
                    await api.updateIssue(issueNumber, title, body);
                    showSuccess(canvasContent, `Issue #${issueNumber} 更新成功！`);
                    // 重新加载Issues和当前Issue详情
                    loadIssues();
                    // 重新获取更新后的Issue并显示
                    const updatedIssues = await api.getIssues();
                    const updatedIssue = updatedIssues.find(iss => iss.number === issueNumber);
                    if (updatedIssue) {
                        onIssueClick(updatedIssue);
                    }
                    updateStatus('Issue更新完成');
                } catch (error) {
                    showError(canvasContent, error);
                    updateStatus('Issue更新失败');
                }
            };

            // 保存评论编辑（全局函数，供表单调用）
            window.saveCommentEdit = async function(commentId) {
                const bodyInput = document.getElementById('comment-body');
                const body = bodyInput.value.trim();

                if (!body) {
                    alert('评论内容不能为空！');
                    return;
                }

                updateStatus(`正在更新评论 #${commentId}...`);
                try {
                    await api.updateComment(commentId, body);
                    showSuccess(canvasContent, `评论 #${commentId} 更新成功！`);
                    // 重新加载当前Issue的评论
                    loadComments(currentIssueNumber);
                    updateStatus('评论更新完成');
                } catch (error) {
                    showError(canvasContent, error);
                    updateStatus('评论更新失败');
                }
            };

            // 添加新评论（全局函数，供表单调用）
            window.addNewComment = async function(issueNumber) {
                const bodyInput = document.getElementById('new-comment-body');
                const body = bodyInput.value.trim();

                if (!body) {
                    alert('评论内容不能为空！');
                    return;
                }

                updateStatus(`正在添加新评论到Issue #${issueNumber}...`);
                try {
                    await api.createComment(issueNumber, body);
                    showSuccess(canvasContent, '新评论添加成功！');
                    // 清空输入框
                    bodyInput.value = '';
                    // 重新加载评论列表
                    loadComments(issueNumber);
                    updateStatus('新评论添加完成');
                } catch (error) {
                    showError(canvasContent, error);
                    updateStatus('添加评论失败');
                }
            };

            // HTML转义函数（防止XSS）
            function escapeHtml(text) {
                if (!text) return '';
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // 刷新按钮事件
            refreshBtn.addEventListener('click', (e) => {
                e.preventDefault();
                currentIssueNumber = null;
                currentCommentId = null;
                loadIssues();
                commentsList.innerHTML = '<p>选择一个issue以加载评论。</p>';
                canvasContent.innerHTML = '<p>点击左侧的issue按钮查看详情，点击右侧的评论按钮查看评论。</p>';
            });

            // 仓库信息按钮事件
            repoInfoBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                updateStatus('获取仓库信息中...');
                try {
                    const repoInfo = await api.getRepoInfo();
                    canvasContent.innerHTML = `
                        <h2>仓库信息</h2>
                        <p><strong>仓库名:</strong> ${repoInfo.full_name}</p>
                        <p><strong>描述:</strong> ${repoInfo.description || '无描述'}</p>
                        <p><strong>Star数:</strong> ${repoInfo.stargazers_count}</p>
                        <p><strong>更新时间:</strong> ${new Date(repoInfo.updated_at).toLocaleString()}</p>
                    `;
                    updateStatus('仓库信息加载完成');
                } catch (error) {
                    showError(canvasContent, error);
                    updateStatus('获取仓库信息失败');
                }
            });

            // 初始加载Issues
            loadIssues();
        });
    </script>
</body>
</html>
